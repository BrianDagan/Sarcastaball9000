name: Checks

on:
  pull_request:
    branches: [main]
  workflow_call:
    outputs:
      checked_sha:
        description: Commit checked by the successful validation job
        value: ${{ jobs.validate.outputs.checked_sha }}
      checked_attempt:
        description: Run attempt that actually completed validation
        value: ${{ jobs.validate.outputs.checked_attempt }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      checked_sha: ${{ steps.checkout.outputs.commit }}
      checked_attempt: ${{ steps.completed.outputs.attempt }}
    env:
      CI: "true"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - name: Check out the exact event commit
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked development dependencies
        run: npm ci --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run Node regressions
        run: npm test

      - name: Validate the public asset manifest
        run: npm run check:publication

      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run isolated browser regressions
        run: npm run test:browser

      - name: Record completed validation attempt
        id: completed
        run: printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
